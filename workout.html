<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interval Workout Timer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: background-color 0.3s ease;
            background-color: #f4f4f9; 
            color: #333;
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 { margin-top: 0; }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box; 
        }

        button {
            width: 100%;
            padding: 15px;
            font-size: 1.2rem;
            color: white;
            background-color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover { background-color: #555; }

        .secondary-btn {
            background-color: #6c757d;
            padding: 10px;
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 15px;
        }

        .secondary-btn:hover { background-color: #5a6268; }

        #multi-sets-container {
            display: none;
            border-top: 1px solid #ddd;
            padding-top: 15px;
            margin-top: 5px;
        }
        
        #timer-display { display: none; }

        .status-text {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0;
        }

        .time-text {
            font-size: 6rem;
            font-weight: bold;
            margin: 10px 0;
            line-height: 1;
        }

        .rep-text {
            font-size: 1.5rem;
            color: #555;
            margin: 5px 0;
        }

        #reset-btn {
            background-color: transparent;
            color: #333;
            border: 2px solid #333;
            margin-top: 20px;
        }

        /* Colors */
        body.work-mode { background-color: #4CAF50; }     /* Green */
        body.rest-mode { background-color: #2196F3; }     /* Blue */
        body.set-rest-mode { background-color: #FF9800; } /* Orange */
        body.done-mode { background-color: #9C27B0; }     /* Purple */
    </style>
</head>
<body>

    <div class="container">
        <div id="setup-screen">
            <h1>Workout Setup</h1>
            
            <div class="input-group">
                <label for="reps">Number of Reps</label>
                <input type="number" id="reps" value="5" min="1">
            </div>

            <div class="input-group">
                <label for="work-time">Work Time (seconds)</label>
                <input type="number" id="work-time" value="30" min="1">
            </div>

            <div class="input-group">
                <label for="rest-time">Rest Time (seconds)</label>
                <input type="number" id="rest-time" value="10" min="0">
            </div>

            <button type="button" id="multi-sets-btn" class="secondary-btn" onclick="enableMultipleSets()">Multiple Sets?</button>

            <div id="multi-sets-container">
                <div class="input-group">
                    <label for="sets">Number of Sets</label>
                    <input type="number" id="sets" value="3" min="1">
                </div>

                <div class="input-group">
                    <label for="set-rest-time">Rest Between Sets (seconds)</label>
                    <input type="number" id="set-rest-time" value="60" min="0">
                </div>
            </div>

            <button onclick="startWorkout()">Start Workout</button>
        </div>

        <div id="timer-display">
            <div class="status-text" id="status-label">GO!</div>
            <div class="time-text" id="time-left">0</div>
            <div class="rep-text" id="rep-count">Rep 1 / 5</div>
            <div class="rep-text" id="set-count" style="display: none;">Set 1 / 3</div>
            <button id="reset-btn" onclick="resetApp()">Stop / Reset</button>
        </div>
    </div>

    <script>
        let totalReps, workDuration, restDuration;
        let totalSets = 1, setRestDuration = 0;
        let useMultipleSets = false;

        let currentRep = 1;
        let currentSet = 1;
        let currentTime = 0;
        let currentPhase = 'WORK'; // 'WORK', 'REP_REST', or 'SET_REST'
        let timerInterval = null;

        const body = document.body;
        const setupScreen = document.getElementById('setup-screen');
        const timerDisplay = document.getElementById('timer-display');
        const statusLabel = document.getElementById('status-label');
        const timeLeft = document.getElementById('time-left');
        const repCount = document.getElementById('rep-count');
        const setCount = document.getElementById('set-count');
        const multiSetsBtn = document.getElementById('multi-sets-btn');
        const multiSetsContainer = document.getElementById('multi-sets-container');

        function enableMultipleSets() {
            useMultipleSets = true;
            multiSetsBtn.style.display = 'none';
            multiSetsContainer.style.display = 'block';
        }

        function startWorkout() {
            totalReps = parseInt(document.getElementById('reps').value);
            workDuration = parseInt(document.getElementById('work-time').value);
            restDuration = parseInt(document.getElementById('rest-time').value);

            if (useMultipleSets) {
                totalSets = parseInt(document.getElementById('sets').value);
                setRestDuration = parseInt(document.getElementById('set-rest-time').value);
            } else {
                totalSets = 1;
                setRestDuration = 0;
            }

            if (!totalReps || !workDuration || isNaN(restDuration) || (useMultipleSets && (!totalSets || isNaN(setRestDuration)))) {
                alert("Please enter valid numbers");
                return;
            }

            setupScreen.style.display = 'none';
            timerDisplay.style.display = 'block';
            setCount.style.display = totalSets > 1 ? 'block' : 'none';

            currentRep = 1;
            currentSet = 1;
            startWorkPhase();
        }

        function startWorkPhase() {
            currentPhase = 'WORK';
            currentTime = workDuration;
            
            body.className = 'work-mode';
            statusLabel.innerText = "WORK";
            updateDisplay();

            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
        }

        function startRepRestPhase() {
            if (restDuration <= 0) {
                currentRep++;
                startWorkPhase();
                return;
            }

            currentPhase = 'REP_REST';
            currentTime = restDuration;

            body.className = 'rest-mode';
            statusLabel.innerText = "REST";
            updateDisplay();

            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
        }

        function startSetRestPhase() {
            if (setRestDuration <= 0) {
                currentSet++;
                currentRep = 1;
                startWorkPhase();
                return;
            }

            currentPhase = 'SET_REST';
            currentTime = setRestDuration;

            body.className = 'set-rest-mode';
            statusLabel.innerText = "SET REST";
            updateDisplay();

            clearInterval(timerInterval);
            timerInterval = setInterval(tick, 1000);
        }

        function tick() {
            currentTime--;
            
            if (currentTime <= 0) {
                handlePhaseSwitch();
            } else {
                updateDisplay();
            }
        }

        function handlePhaseSwitch() {
            clearInterval(timerInterval); 

            if (currentPhase === 'WORK') {
                if (currentRep < totalReps) {
                    startRepRestPhase();
                } else if (currentSet < totalSets) {
                    startSetRestPhase();
                } else {
                    finishWorkout();
                }
            } else if (currentPhase === 'REP_REST') {
                currentRep++;
                startWorkPhase();
            } else if (currentPhase === 'SET_REST') {
                currentSet++;
                currentRep = 1;
                startWorkPhase();
            }
        }

        function updateDisplay() {
            timeLeft.innerText = currentTime;
            repCount.innerText = `Rep ${currentRep} / ${totalReps}`;
            if (totalSets > 1) {
                setCount.innerText = `Set ${currentSet} / ${totalSets}`;
            }
        }

        function finishWorkout() {
            body.className = 'done-mode';
            statusLabel.innerText = "DONE!";
            timeLeft.innerText = "✓";
            repCount.innerText = "Great Job";
            setCount.style.display = 'none';
        }

        function resetApp() {
            clearInterval(timerInterval);
            body.className = ''; 
            setupScreen.style.display = 'block';
            timerDisplay.style.display = 'none';
        }
    </script>
</body>
</html>
